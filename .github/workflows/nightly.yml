# The nightly full run behind local selection (T-41, T-216). `bin/dev check` skips the test files a diff cannot reach,
# through the coverage map this workflow writes: every selectable test file runs here under coverage, and only a run
# where all of them pass uploads its map. `bin/dev check` downloads the map of the latest successful run with gh.
# The bun typecheck shadow runs here too, out of the pull request gate, until T-53 decides bun's fate.
# The tests/ui browser set runs here as well (T-301), chromium then webkit, over a seeded production build on the
# runner's own throwaway Postgres, with no secret or outside service. `bin/dev nightly` stays the local run of the
# same set on a preview of origin/main until it is retired (D-1377).
# GitHub runs a schedule on the default branch only. fail-forward reports a failed run on main as one incident.
name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"

jobs:
  coverage:
    name: coverage map (every selectable test file)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # operation rule and rule placement checks read baseline commits
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack at the packageManager version in package.json, installed once. The pnpm store
      # cache below calls pnpm, so it comes after.
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "evf ci"
          git config --global user.email "ci@everyfield.invalid"
          git config --global init.defaultBranch main
      # Writes the map only when every test passed; otherwise it fails and no map is uploaded.
      - name: Every selectable test file under coverage
        run: node scripts/nightly.ts coverage-map "$RUNNER_TEMP/coverage-map.json"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Coverage map
        uses: actions/upload-artifact@v7
        with:
          name: coverage-map
          path: ${{ runner.temp }}/coverage-map.json
          if-no-files-found: error
          retention-days: 14

  bun-shadow:
    name: bun typecheck shadow (T-53)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bun check over every package
        run: pnpm typecheck:bun

  ui:
    # Every tests/ui/**/*.test.mjs (the list `bin/dev nightly` runs), once per engine, over one seeded production build.
    # scripts/nightly-ui.ts seeds every tests/ui seed into the service's everyfield_ci (CI=true and
    # EARLY_ACCESS_TEST_DATABASE=1 let the seeds use it, D-1378), then starts the server, which reads the env file the
    # seeds wrote: the scripted Evry model and the dev mail capture. A failed chromium run still lets webkit run; either
    # one failing fails the job.
    name: tests/ui (chromium and webkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # GitHub allows no runner context in a job's env, so the later steps read UI_DIR from GITHUB_ENV.
      - name: tests/ui directory
        run: echo "UI_DIR=$RUNNER_TEMP/nightly-ui" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright chromium and webkit with their system dependencies
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit
      # The seeds accept only a *.localhost origin; this name reaches the server on 127.0.0.1 in both engines.
      - name: nightly.localhost on the loopback
        run: echo "127.0.0.1 nightly.localhost" | sudo tee -a /etc/hosts
      - name: Production build
        run: pnpm build
      - name: Seed tests/ui and serve the build
        id: up
        run: node scripts/nightly-ui.ts up "$UI_DIR"
      - name: tests/ui chromium
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 25
        run: node scripts/nightly-ui.ts test chromium "$UI_DIR"
      - name: tests/ui webkit
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 25
        run: node scripts/nightly-ui.ts test webkit "$UI_DIR"
      - name: Stop the server
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: node scripts/nightly-ui.ts down "$UI_DIR"
      # The test and server logs and the mail outbox. The fixtures hold seeded session cookies and stay out.
      - name: tests/ui logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-ui-logs
          path: |
            ${{ runner.temp }}/nightly-ui
            !${{ runner.temp }}/nightly-ui/fixtures
          if-no-files-found: ignore
          retention-days: 14
