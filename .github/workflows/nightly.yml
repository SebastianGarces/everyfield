name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"

jobs:
  coverage:
    name: coverage map (every selectable test file)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "evf ci"
          git config --global user.email "ci@everyfield.invalid"
          git config --global init.defaultBranch main
      - name: Every selectable test file under coverage
        run: node scripts/nightly.ts coverage-map "$RUNNER_TEMP/coverage-map.json"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Coverage map
        uses: actions/upload-artifact@v7
        with:
          name: coverage-map
          path: ${{ runner.temp }}/coverage-map.json
          if-no-files-found: error
          retention-days: 14

  logs:
    name: server log privacy (BUG-PR199, until it runs offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Server log privacy (next dev with synthetic passwords)
        run: pnpm test:logs
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  bun-shadow:
    name: bun typecheck shadow (T-53)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: bun check over every package
        run: pnpm typecheck:bun

  ui:
    name: tests/ui (chromium and webkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: tests/ui directory
        run: echo "UI_DIR=$RUNNER_TEMP/nightly-ui" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Playwright chromium and webkit with their system dependencies
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: nightly.localhost on the loopback (the seeds accept only a *.localhost origin)
        run: echo "127.0.0.1 nightly.localhost" | sudo tee -a /etc/hosts
      - name: Production build
        run: pnpm build
      - name: Seed tests/ui and serve the build
        id: up
        run: node scripts/nightly-ui.ts up "$UI_DIR"
      - name: tests/ui chromium
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 25
        run: node scripts/nightly-ui.ts test chromium "$UI_DIR"
      - name: tests/ui webkit
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 25
        run: node scripts/nightly-ui.ts test webkit "$UI_DIR"
      - name: Stop the server
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: node scripts/nightly-ui.ts down "$UI_DIR"
      - name: tests/ui logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-ui-logs
          path: |
            ${{ runner.temp }}/nightly-ui
            !${{ runner.temp }}/nightly-ui/fixtures
          if-no-files-found: ignore
          retention-days: 14

  formal:
    name: formal replay (fresh seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Migrate the throwaway database
        run: pnpm db:migrate
      - name: Generate and replay permissions behaviors from a fresh seed
        run: node scripts/nightly-formal.ts
