# Deterministic checks for every pull request and for main.
# The required status check is the `ci` job. It passes only when every other job passed.
# The domain tests run against a throwaway Postgres 17 service container with a synthetic
# password, never against Neon. CI uses no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.1"

jobs:
  app:
    name: app (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: pnpm in the corepack cache (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint, image locks, colour literals)
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Server log privacy (next dev with synthetic passwords)
        run: pnpm test:logs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package unit tests (each package's test:unit, no database or network)
        run: corepack pnpm -r --if-present test:unit

  docs:
    name: docs (documentation and case checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # operation rule and rule placement checks read baseline commits
      - name: Documentation, catalog and acceptance case checks
        run: python3 docs/check-all.py

  evf:
    name: evf (tooling tests)
    env:
      EVF_MONITOR: github-actions-evf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm in the corepack cache (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "evf ci"
          git config --global user.email "ci@everyfield.invalid"
          git config --global init.defaultBranch main
      - run: bin/evf test
      - name: Local stack isolation and reporting
        run: corepack pnpm test:workflow
      - name: Failure reporting and internal queue invariants
        run: node --test .github/scripts/*.test.cjs

  db:
    name: db (domain tests on Postgres 17)
    runs-on: ubuntu-24.04
    # The statement census also builds the app once and counts real HTTP requests on it.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: pnpm in the corepack cache (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - run: pnpm install --frozen-lockfile
      - name: Migrate the throwaway database
        run: pnpm db:migrate
      - name: Current catalog against a fresh full migration chain
        run: python3 packages/db/src/schema/generate.py --check
      - uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Production build for the per-request statement budgets
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Domain tests
        run: pnpm -r --if-present test:db

  wiki:
    name: wiki (tooling tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/wiki
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/wiki/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: tools/wiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/wiki/pnpm-lock.yaml') }}
      - name: Chromium for render tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  ci:
    name: ci
    if: always()
    needs: [app, db, docs, evf, wiki]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
