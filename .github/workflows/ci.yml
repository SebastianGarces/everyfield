name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.1"
  CENSUS_PARTS: "3"

jobs:
  app:
    name: app (lint, types, logs, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint (Oxlint, ESLint, lint baselines against main, image locks, colour literals)
        run: pnpm lint
      - name: Lint rules stay on, cover every file and only shrink their baselines
        run: node scripts/lint/check-comments.mjs
      - name: Types
        run: pnpm typecheck
      - name: Server log privacy (next dev with synthetic passwords)
        run: pnpm test:logs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: LibreOffice packages from the cache (the runner's Ubuntu mirror can be slow)
        id: libreoffice-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/libreoffice-debs
          key: libreoffice-debs-ubuntu-24.04-${{ runner.arch }}-writer-calc-v1
      - name: LibreOffice packages from the Ubuntu mirror (cold cache only)
        if: ${{ steps.libreoffice-debs.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get clean
          sudo apt-get install -y --no-install-recommends --download-only libreoffice-writer libreoffice-calc
          mkdir -p ~/libreoffice-debs
          cp /var/cache/apt/archives/*.deb ~/libreoffice-debs/
          ls ~/libreoffice-debs | wc -l
          du -sh ~/libreoffice-debs
      - name: LibreOffice packages saved to the cache
        if: ${{ steps.libreoffice-debs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/libreoffice-debs
          key: ${{ steps.libreoffice-debs.outputs.cache-primary-key }}
      - name: LibreOffice and the upright DM Sans fonts for the documents tests
        run: |
          if ! sudo apt-get install -y --no-install-recommends --no-download ~/libreoffice-debs/*.deb; then
            echo "This runner image lacks a dependency the cached packages assumed; fetching only that from the mirror."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ~/libreoffice-debs/*.deb
          fi
          sudo mkdir -p /usr/local/share/fonts/everyfield
          sudo cp packages/domain/src/documents/fonts/DMSans-{Regular,Medium,Bold}.ttf packages/domain/src/documents/fonts/DMSerifDisplay-Regular.ttf /usr/local/share/fonts/everyfield/
          fc-cache -f
          soffice --version
      - name: Package unit tests (each package's test:unit, no database or network)
        run: corepack pnpm -r --if-present test:unit
        env:
          REQUIRE_SOFFICE: "1"

  tooling:
    name: tooling (docs, workflow, tools, wiki)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Shared setup (Node, pnpm, node_modules)
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          extra-dirs: tools/wiki
          save-modules: "false"
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "evf ci"
          git config --global user.email "ci@everyfield.invalid"
          git config --global init.defaultBranch main
      - name: Documentation, catalog and acceptance case checks
        if: ${{ !cancelled() }}
        run: python3 docs/check-all.py
      - name: Local stack isolation and reporting
        if: ${{ !cancelled() }}
        run: corepack pnpm test:workflow
      - name: Evry eval coverage
        if: ${{ !cancelled() }}
        run: node --test tests/workflow/evry-evals-coverage.test.mjs
      - name: Failure reporting and internal queue invariants
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/*.test.cjs
      - name: Every integration test runs in CI
        if: ${{ !cancelled() }}
        run: node tools/ci/ci-tests.ts
      - name: CI test coverage tool
        if: ${{ !cancelled() }}
        run: node --test tools/ci/tests/*.test.ts
      - name: Feature maps (routes, proofs and diagrams)
        if: ${{ !cancelled() }}
        run: corepack pnpm feature-maps
      - name: QA preview tool
        if: ${{ !cancelled() }}
        run: node --test --disable-warning=ExperimentalWarning tools/qa/tests/*.test.ts
      - name: Actionable watcher
        if: ${{ !cancelled() }}
        run: node --test ops/actionable-watch/test/*.test.mts
      - name: Wiki tool install
        if: ${{ !cancelled() }}
        id: wiki-install
        working-directory: tools/wiki
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Shared setup (save node_modules with the wiki tool's)
        if: ${{ !cancelled() && steps.wiki-install.outcome == 'success' && steps.setup.outputs.modules-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.modules-paths }}
          key: ${{ steps.setup.outputs.modules-key }}
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.wiki-install.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/wiki/pnpm-lock.yaml') }}
      - name: Chromium for render tests
        if: ${{ !cancelled() && steps.wiki-install.outcome == 'success' }}
        id: chromium
        working-directory: tools/wiki
        run: pnpm exec playwright install chromium
      - name: Wiki tool tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: tools/wiki
        run: pnpm test

  db:
    name: db (@everyfield/db, evry)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Migrate the throwaway database
        id: migrate
        run: pnpm db:migrate
      - name: Current catalog against a fresh full migration chain
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: python3 packages/db/src/schema/generate.py --check
      - name: "@everyfield/db tests"
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm --filter "@everyfield/db" test:db
      - name: "@everyfield/evry tests"
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm --filter "@everyfield/evry" test:db

  domain:
    name: domain (census part ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            build: true
          - part: 2
          - part: 3
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Migrate the throwaway database
        run: pnpm db:migrate
      - uses: actions/cache@v6
        if: matrix.build
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Production build for the per-request statement budgets
        id: build
        if: matrix.build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Domain tests
        run: pnpm --filter "@everyfield/domain" test:db
        env:
          EVF_CENSUS_LOGS: ${{ runner.temp }}/census
          EVF_CENSUS_PART: ${{ format('{0}/{1}', matrix.part, env.CENSUS_PARTS) }}
      - name: Server traces hold the runtime reference files (WP-032)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --test tests/reference/server-trace.test.mjs
      - name: Statement census part
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: statement-census-part-${{ matrix.part }}
          path: ${{ runner.temp }}/census
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [app, db, domain, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: needs.domain.result == 'success'
      - name: Shared setup (Node)
        if: needs.domain.result == 'success'
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install: "false"
      - uses: actions/download-artifact@v8
        if: needs.domain.result == 'success'
        with:
          pattern: statement-census-part-*
          path: ${{ runner.temp }}/census
      - name: Statement budgets over the union of the parts
        id: union
        if: needs.domain.result == 'success'
        run: node --test tests/integration/writes/statements.test.mts
        env:
          EVF_CENSUS_UNION: ${{ runner.temp }}/census
      - name: Every check passed
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          UNION: ${{ steps.union.outcome }}
        run: |
          echo "results: $RESULTS; census union: $UNION"
          for r in $RESULTS $UNION; do [ "$r" = success ] || exit 1; done
