# Deterministic checks for every pull request and for main.
# The required status check is the `ci` job. It passes only when every other job passed.
# The database tests run against throwaway Postgres 17 service containers, one for the db job and one per domain
# census part, with a synthetic password, never against Neon. CI uses no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dormant until this repository can use a merge queue (OPS-56): the `ci` check then also runs on the queue commit.
  merge_group:
  # One full run on main every night (T-41): everything local selection may skip. GitHub runs a schedule on the
  # default branch only, and fail-forward reports a failed scheduled run as it does a failed push.
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.1"
  # The domain matrix lists census parts 1 to CENSUS_PARTS; the ci job checks their union.
  CENSUS_PARTS: "3"

jobs:
  app:
    name: app (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack at the packageManager version in package.json, installed once. The pnpm store
      # cache below calls pnpm, so it comes after.
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint, image locks, colour literals)
        run: pnpm lint
      - name: Types
        run: |
          pnpm typecheck
          pnpm typecheck:tsc
      - name: Server log privacy (next dev with synthetic passwords)
        run: pnpm test:logs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Server traces hold the runtime reference files (WP-032)
        run: node --test tests/reference/server-trace.test.mjs
      # The documents tests open the Word and Excel exports in LibreOffice, so they paginate with the fonts the files name.
      # Only the upright DM Sans files: the italic ones alone carry the legacy family name "DM Sans", and LibreOffice would
      # set all body text in italic.
      - name: LibreOffice and the document fonts for the documents tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          sudo mkdir -p /usr/local/share/fonts/everyfield
          sudo cp packages/domain/src/documents/fonts/DMSans-{Regular,Medium,Bold}.ttf packages/domain/src/documents/fonts/DMSerifDisplay-Regular.ttf /usr/local/share/fonts/everyfield/
          fc-cache -f
          soffice --version
      # REQUIRE_SOFFICE=1 makes the LibreOffice checks fail instead of skip when soffice is missing (sofficeTest).
      - name: Package unit tests (each package's test:unit, no database or network)
        run: corepack pnpm -r --if-present test:unit
        env:
          REQUIRE_SOFFICE: "1"

  tooling:
    # The checks that need no database service of their own: documentation, local stack and CI scripts, the product
    # tools and the wiki tool, run in sequence on one runner so each skips its own setup. The QA seed tests migrate a
    # Docker Postgres with db:migrate. A failed step still lets the later ones run and report.
    name: tooling (docs, workflow, tools, wiki)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # operation rule and rule placement checks read baseline commits
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack at the packageManager version in package.json (tools/wiki pins the same), installed
      # once. The pnpm store cache below calls pnpm, so it comes after.
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/wiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Git identity for test fixtures
        run: |
          git config --global user.name "evf ci"
          git config --global user.email "ci@everyfield.invalid"
          git config --global init.defaultBranch main
      - name: Documentation, catalog and acceptance case checks
        if: ${{ !cancelled() }}
        run: python3 docs/check-all.py
      - name: Local stack isolation and reporting
        if: ${{ !cancelled() }}
        run: corepack pnpm test:workflow
      - name: Evry eval coverage
        if: ${{ !cancelled() }}
        run: node --test tests/workflow/evry-evals-coverage.test.mjs
      - name: Failure reporting and internal queue invariants
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/*.test.cjs
      - name: Every integration test runs in CI
        if: ${{ !cancelled() }}
        run: node tools/ci/ci-tests.ts
      - name: CI test coverage tool
        if: ${{ !cancelled() }}
        run: node --test tools/ci/tests/*.test.ts
      - name: QA preview tool
        if: ${{ !cancelled() }}
        run: node --test --disable-warning=ExperimentalWarning tools/qa/tests/*.test.ts
      # The launchd watcher (ops/actionable-watch). Its one plutil test needs macOS and is skipped here.
      - name: Actionable watcher
        if: ${{ !cancelled() }}
        run: node --test ops/actionable-watch/test/*.test.mts
      # The wiki tool has its own lockfile outside the workspace.
      - name: Wiki tool install
        if: ${{ !cancelled() }}
        id: wiki-install
        working-directory: tools/wiki
        run: pnpm install --frozen-lockfile --ignore-workspace
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.wiki-install.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/wiki/pnpm-lock.yaml') }}
      # The runner image already has the libraries Chromium needs. `--with-deps` ran apt on
      # every run, and a slow Ubuntu mirror held the job until the timeout cancelled it.
      - name: Chromium for render tests
        if: ${{ !cancelled() && steps.wiki-install.outcome == 'success' }}
        id: chromium
        working-directory: tools/wiki
        run: pnpm exec playwright install chromium
      - name: Wiki tool tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        working-directory: tools/wiki
        run: pnpm test

  db:
    # Every package with a test:db script except @everyfield/domain, one after another on one Postgres service. Each
    # suite makes its own random schema in everyfield_ci and drops it at the end, so the suites share the database as
    # they share the development one. A failed suite still lets the later ones run and report.
    # `node tools/ci/ci-tests.ts` fails when a package with test:db runs in no CI step.
    name: db (@everyfield/db, reference, evry)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack at the packageManager version in package.json, installed once. The pnpm store
      # cache below calls pnpm, so it comes after.
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the throwaway database
        id: migrate
        run: pnpm db:migrate
      - name: Current catalog against a fresh full migration chain
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: python3 packages/db/src/schema/generate.py --check
      - name: "@everyfield/db tests"
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm --filter "@everyfield/db" test:db
      - name: "@everyfield/reference tests"
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm --filter "@everyfield/reference" test:db
      - name: "@everyfield/evry tests"
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: pnpm --filter "@everyfield/evry" test:db

  domain:
    # @everyfield/domain runs only the statement census, split into CENSUS_PARTS parts that run side by side, each on
    # its own Postgres service. The ci job checks their union.
    name: domain (census part ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            # Part 1 counts real HTTP requests on the production build.
            build: true
          - part: 2
          - part: 3
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: everyfield_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d everyfield_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/everyfield_ci
      EARLY_ACCESS_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack at the packageManager version in package.json, installed once. The pnpm store
      # cache below calls pnpm, so it comes after.
      - name: pnpm from corepack (retries registry errors)
        run: .github/scripts/corepack-install.sh
      - name: pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the throwaway database
        run: pnpm db:migrate
      - uses: actions/cache/restore@v6
        if: matrix.build
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Production build for the per-request statement budgets
        if: matrix.build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Domain tests
        run: pnpm --filter "@everyfield/domain" test:db
        env:
          EVF_CENSUS_LOGS: ${{ runner.temp }}/census
          EVF_CENSUS_PART: ${{ format('{0}/{1}', matrix.part, env.CENSUS_PARTS) }}
      # Each census part keeps its full logs (behaviors.log holds every inner assertion and its time) and its counts
      # file. The ci job reads the counts; a failed or timed-out part leaves its logs for reading. A rerun replaces its
      # part's artifact.
      - name: Statement census part
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: statement-census-part-${{ matrix.part }}
          path: ${{ runner.temp }}/census
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  ci:
    # The one required check. It passes only when every other job passed and the census union holds. The union rules
    # over the whole census: every budget measured by some part, every declared write exercised, no budget above its
    # most measured count. It needs no database: it reads the counts files of every passing domain part.
    name: ci
    if: always()
    needs: [app, db, domain, tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: needs.domain.result == 'success'
      - uses: actions/setup-node@v7
        if: needs.domain.result == 'success'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        if: needs.domain.result == 'success'
        with:
          pattern: statement-census-part-*
          path: ${{ runner.temp }}/census
      - name: Statement budgets over the union of the parts
        id: union
        if: needs.domain.result == 'success'
        run: node --test tests/integration/writes/statements.test.mts
        env:
          EVF_CENSUS_UNION: ${{ runner.temp }}/census
      - name: Every check passed
        if: always()
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          UNION: ${{ steps.union.outcome }}
        run: |
          echo "results: $RESULTS; census union: $UNION"
          for r in $RESULTS $UNION; do [ "$r" = success ] || exit 1; done
