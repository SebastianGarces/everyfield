name: Promote production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Trusted promoter from main, never code from the CI run
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Promote the exact green commit
        uses: actions/github-script@v8
        env:
          TRUNK_PROMOTE: ${{ vars.TRUNK_PROMOTE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          VERCEL_PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
        with:
          script: |
            const promote = require('./.github/scripts/promote.cjs');
            await promote({ github, context, core, exec });
