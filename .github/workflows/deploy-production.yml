name: Deploy production

# Production builds here on a free runner, not on Vercel's build machines (T-584). Vercel's own git build for main
# stays on until a run of this workflow has deployed a main commit and the site served it; then apps/web/vercel.json
# turns git deployments off for every branch.

on:
  push:
    branches: [main]
    # A commit deploys when it touches something the build or the running app reads. Later "!" lines win, so
    # markdown and tests inside these trees, and everything outside them, do not deploy.
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - "patches/**"
      # Read by app code outside apps/web and packages: JSON imports and the marketing CSS.
      - "docs/reference/**"
      - "design/handoff/**"
      - "design/marketing-copy.json"
      - ".github/workflows/deploy-production.yml"
      - "!**/*.md"
      - "!**/*.test.*"
      - "!**/tests/**"
      - "!**/__tests__/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"
  VERCEL_CLI: "vercel@65.11.0"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The CLI reads these from the environment, so the token never appears in a command line or the log.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shared setup (Node, pnpm, node_modules)
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vercel production settings and environment
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production
      - name: Production build
        run: npx --yes "$VERCEL_CLI" build --prod
      - name: Deploy the prebuilt output to production
        run: |
          set -euo pipefail
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --meta "githubCommitSha=$GITHUB_SHA")
          echo "Deployed $GITHUB_SHA to $url"
          echo "Production deployment for \`$GITHUB_SHA\`: $url" >> "$GITHUB_STEP_SUMMARY"
