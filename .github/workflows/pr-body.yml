# Checks the PR body against its class template. Ordinary work uses everyfield-pr/template.md;
# Wiki articles and feedback prototypes use tools/evf/templates.
# Runs on PR open, edit and push, so the `pr-body` check exists on every head. It does not depend
# on `ci` or on the review, so there is no cycle. A missing or empty template fails the check.
name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# Every event must finish its required check, including edits on the same head.
# A concurrency group can cancel running or pending duplicates and leave a cancelled check.

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            bin
            tools/evf
            .agents/skills/everyfield-pr
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
      - name: Required sections and EVF-Author line for the PR class
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bin/evf pr body "$PR_NUMBER"
