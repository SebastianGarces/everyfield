  var pp = e.target.closest && e.target.closest(".ovs-pp");
  if (pp && OVS.root) { if (REDUCED.matches) ovsGo((OVS.k + 1) % 3); else { OVS.paused = !OVS.paused; ovsBtn(); ovsSched(); } return; }
  var q = e.target.closest && e.target.closest(".faq-q");
  if (q) faqSet(q.closest(".faq-i"), q.getAttribute("aria-expanded") !== "true");
});
document.addEventListener("visibilitychange", function () { if (OVS.root) ovsSched(); });
window.addEventListener("resize", function () { if (OVS.root && OVS.root.isConnected) ovsSize(); });
/* Revision 26: FAQ in place of the privacy section. Title left, accordion right (desktop). Each question is a button that opens its answer
   with a 300 ms height and fade; several can be open at once; all closed by default. #faq-<id> in at= opens that item. */
function ovFaq(f) {
  return '<section class="sec sec-ov-faq" id="faq"><div class="wrap"><div class="faq-grid"><h2 class="display h2 faq-title">' + t(f.headline) + '</h2><div class="faq-list">' + f.items.map(function (x) {
    var id = "faq-" + x.id, a = t(x.a);
    if (x.link) a = a.replace(t(x.link), '<a href="' + hrefFor("access", "network-form") + '">' + t(x.link) + "</a>");
    return '<div class="faq-i" id="' + id + '"><h3 class="faq-h"><button type="button" class="faq-q" id="' + id + '-q" aria-expanded="false" aria-controls="' + id + '-a"><span>' + t(x.q) + '</span><span class="faq-pm" aria-hidden="true"></span></button></h3>' +
      '<div class="faq-a" id="' + id + '-a"><div class="faq-in"><p>' + a + "</p></div></div></div>";
  }).join("") + "</div></div></div></section>";
}
function faqSet(item, open) {
  if (!item) return;
  item.classList.toggle("open", open);
  item.querySelector(".faq-q").setAttribute("aria-expanded", String(open));
}
function pageTrust() {
  var A = DIR.journey.sections, B = DIR.oversight.sections, P = COPY.shared.trust_page;
  var Y = function (s) { return '<span class="yes">' + s + "</span>"; }, N = function (s) { return '<span class="no">' + s + "</span>"; };
  var rows = [
    ["Owner", Y("Full"), Y("Full"), Y("Full"), Y("Own only"), Y("Yes")],
    ["Admin", Y("Full"), Y("Full"), Y("Full"), N("No"), Y("Yes")],
    ["Member", Y("View"), Y("View, own tasks"), Y("View"), N("No"), Y("Own tasks and duties")],
    ["Sending church or network", N("Never"), N("Counts only"), Y("Summary, when shared"), N("No"), N("No")]
  ];
  var groups = [["For planters", P.planter_rules], ["For sending churches and networks", B.trust]];
  var limits = [A.evry.limits, B.evry.limits];
  return hero({ eyebrow: P.eyebrow, headline: P.headline, subhead: P.subhead, cta_primary: "Request early access", cta_secondary: "Talk to us about your network" }, "journey", { page: true, visual: false }) +
    '<section class="sec" id="who-sees-what" style="padding-top:0"><div class="wrap"><div class="sec-head"><h2 class="display h2 sh-title">Who sees what</h2><p class="body-2 sh-text">' + t("Planters own their records. Each role sees only what it needs.") + "</p></div>" +
    '<div class="access-table-wrap"><table class="access-table"><thead><tr><th>Role</th><th>People and notes</th><th>Meetings and tasks</th><th>Plant Intelligence</th><th>Private check-in</th><th>Can change records</th></tr></thead><tbody>' +
    rows.map(function (r) { return "<tr><th>" + r[0] + "</th>" + r.slice(1).map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div></div></section>" +
    '<section class="sec" style="padding-top:0"><div class="wrap rule-groups">' + groups.map(function (g) { return '<div><div class="sec-head solo" style="margin-bottom:28px"><div class="sh-title"><span class="eyebrow">' + g[0] + '</span><h2 class="display h3" style="margin-top:12px;font-size:var(--mk-fs-h2);font-family:var(--mk-font-display)">' + t(g[1].headline) + "</h2></div></div>" + trustGrid(g[1].items) + "</div>"; }).join("") +
    '<div><div class="sec-head solo" style="margin-bottom:28px"><div class="sh-title"><span class="eyebrow">Evry</span></div></div><div class="trust-grid three">' + limits.map(function (l) { return '<div class="trust-item"><span class="ti-icon">' + icon("shield") + "</span><p>" + t(l) + "</p></div>"; }).join("") + "</div></div></div></section>" +
    cta(A.cta);
}
function pageAccess() {
  var A = DIR.journey.sections, B = DIR.oversight.sections;
  var phases = ["0 · Discovery", "1 · Core group", "2 · Launch team", "3 · Training", "4 · Pre-launch", "5 · Launch Sunday", "6 · Post-launch"];
  function f(label, type, opt) { return '<div class="field"><label>' + label + (opt ? " <small>(optional)</small>" : "") + "</label>" + (type === "select" ? "<select>" + phases.map(function (p) { return "<option>" + p + "</option>"; }).join("") + "</select>" : type === "area" ? "<textarea></textarea>" : '<input type="' + type + '">') + "</div>"; }
  return hero({ eyebrow: "Early access", headline: COPY.shared.nav_cta, subhead: A.cta.body, cta_primary: "Request early access", cta_secondary: "Talk to us about your network", note: A.cta.note }, "journey", { page: true, visual: false }) +
    '<section class="sec" style="padding-top:0"><div class="wrap forms">' +
    '<form class="form-card" id="planter-form" data-proto-form><span class="eyebrow">' + t(A.audiences.items[0].label) + '</span><h2 class="display h3">' + t(A.audiences.items[0].headline) + '</h2><p class="small">' + t(A.audiences.items[0].body) + "</p>" +
    f("Your name", "text") + f("Email", "email") + f("Church plant name", "text") + f("City", "text") + f("Phase", "select") + f("Sending church or network", "text", true) +
    '<button class="mk-btn primary" type="submit">' + t(A.cta.cta_primary) + icon("arrow") + '</button><div class="form-msg" role="status">Prototype only. Nothing was sent.</div></form>' +
    '<form class="form-card" id="network-form" data-proto-form><span class="eyebrow">For networks and sending churches</span><h2 class="display h3">' + t(B.cta.headline) + '</h2><p class="small">' + t(B.cta.body) + "</p>" +
    f("Your name", "text") + f("Email", "email") + f("Network or church", "text") + f("Your role", "text") + f("Plants you send or support", "number", true) + f("What would you like to talk about?", "area", true) +
    '<button class="mk-btn primary" type="submit">' + t(B.cta.cta_primary) + icon("arrow") + '</button><div class="form-msg" role="status">Prototype only. Nothing was sent.</div></form></div></section>';
}
function pageLegal(title) {
  return '<section class="hero page-hero" id="top"><div class="wrap">' +
    '<h1 class="display hero-title" style="font-size:var(--mk-fs-h1)">' + title + '</h1><div class="legal-body" style="margin-top:36px"><p>' + t("The full " + title.toLowerCase() + " will be published here before Everyfield launches.") + "</p><p>" + t(COPY.shared.footer.fineprint) + "</p></div></div></section>";
}

/* ---------- Chrome ---------- */
var NAVMAP = { "Product": ["home", "features"], "For planters": ["planters", ""], "For sending churches and networks": ["oversight", ""], "Privacy": ["trust", ""] };
function renderNav() {
  var html = navHTML();
  document.getElementById("site-nav").innerHTML = html;
  document.getElementById("nav-pill").innerHTML = html;
  navPill(true);
}
function navHTML() {
  return '<div class="wrap"><a href="' + hrefFor("home") + '" aria-label="Everyfield home" class="nav-home">' + logo("nav-logo") + "</a>" +
    '<nav class="nav-links" aria-label="Main">' + COPY.shared.nav.map(function (n) {
      var r = NAVMAP[n.label] || ["home", ""];
      var cur = r[0] === state.page && r[0] !== "home" && !r[1] ? ' aria-current="page"' : "";
      return '<a href="' + hrefFor(r[0], r[1]) + '"' + cur + ">" + t(n.label) + "</a>";
    }).join("") + '<a class="mk-btn primary nav-cta-m" href="' + routeHref(COPY.shared.nav_cta) + '">' + t(COPY.shared.nav_cta) + "</a></nav>" +
    '<div class="nav-end"><a class="signin" href="#" data-toast="Sign in is not part of the marketing prototype.">' + t(COPY.shared.nav_signin) + "</a>" + btn(COPY.shared.nav_cta) +
    '<button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">' + icon("menu") + "</button></div></div>";
}
/* Floating pill: shown once the scroll passes the in-flow nav height. One rAF per scroll burst. */
var NAVP = { on: null, ticking: false };
function navClose() {
  ["site-nav", "nav-pill"].forEach(function (id) {
    var el = document.getElementById(id); el.classList.remove("open");
    var tg = el.querySelector(".nav-toggle"); if (tg) tg.setAttribute("aria-expanded", "false");
  });
}
function navPill(force) {
  NAVP.ticking = false;
  var nav = document.getElementById("site-nav"), pill = document.getElementById("nav-pill");
  var on = window.scrollY > nav.offsetHeight;
  if (on === NAVP.on && !force) return;
  if (on !== NAVP.on) navClose();
  NAVP.on = on;
  pill.classList.toggle("on", on);
  if (on) { pill.removeAttribute("inert"); pill.setAttribute("aria-hidden", "false"); } else { pill.setAttribute("inert", ""); pill.setAttribute("aria-hidden", "true"); }
}
window.addEventListener("scroll", function () { if (!NAVP.ticking) { NAVP.ticking = true; requestAnimationFrame(function () { navPill(); }); } }, { passive: true });
var FOOTMAP = { "Overview": ["home", ""], "Plant Intelligence": ["home", "intelligence"], "Evry": ["planters", "evry"], "Planters": ["planters", ""], "Sending churches and networks": ["oversight", ""], "Privacy and trust": ["trust", ""], "Contact": ["access", "network-form"], "Privacy policy": ["privacy", ""], "Terms": ["terms", ""] };
function renderFooter() {
  var f = COPY.shared.footer;
  document.getElementById("site-footer").innerHTML = '<div class="ft-card"><div class="ft-lead"><span class="ft-mark">' + mark() + '</span><h2 class="display">' + t(f.headline) + "</h2>" + btn(f.cta) + "</div>" +
    '<nav class="ft-cols" aria-label="Footer">' + f.columns.map(function (c) {
      return "<div><h4>" + t(c.title) + "</h4><ul>" + c.links.map(function (l) {
        var r = FOOTMAP[l];
        return "<li>" + (r ? '<a href="' + hrefFor(r[0], r[1]) + '">' + t(l) + "</a>" : '<span class="ft-later">' + t(l) + "<small>Later</small></span>") + "</li>";
      }).join("") + "</ul></div>";
    }).join("") + "</nav>" +
    '<div class="ft-bottom">' + wordmark() + "<span>" + t(f.fineprint) + "</span></div></div>";
}
function renderBar() {
  var bar = document.getElementById("pbar");
  var onHome = state.page === "home";
  var ps = pageStory();
  var pageOpts = PAGES.map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.page ? " selected" : "") + ">" + p.name + "</option>"; }).join("") +
    '<optgroup label="Later, not in v1">' + LATER.map(function (l) { return "<option disabled>" + l + "</option>"; }).join("") + "</optgroup>";
  bar.innerHTML = '<span class="pb-tag">Prototype</span>' +
    '<div class="pb-group sel"><select class="pb-page" aria-label="Page">' + pageOpts + "</select>" +
    '<select class="m pb-story" aria-label="Story"' + (onHome ? "" : " disabled") + ">" + STORIES.map(function (s) { return '<option value="' + s.id + '"' + (s.id === ps ? " selected" : "") + ' title="' + esc(DIR[s.id].name) + '">Story ' + s.key + "</option>"; }).join("") + "</select></div>" +
    '<div class="pb-group"><span class="pb-lab">Story</span><div class="seg" role="group" aria-label="Story">' + STORIES.map(function (s) { return '<button type="button" data-story="' + s.id + '" title="' + esc(DIR[s.id].name) + '" aria-pressed="' + (s.id === ps) + '"' + (onHome ? "" : " disabled") + "><b>" + s.key + "</b>" + s.short + "</button>"; }).join("") + "</div>" +
    (onHome ? "" : '<span class="pb-note">Fixed for this page</span>') + "</div>" +
    '<div class="pb-group"><button type="button" class="pb-btn pb-copy" title="Copy a link to this page and story">' + icon("link") + '<span class="l">Copy link</span></button>' +
    '<button type="button" class="pb-btn pb-hide" title="Hide controls" aria-label="Hide controls">' + icon("x") + "</button></div>";
}

/* ---------- Apply ---------- */
var last = {};
/* Round 4: photo slots load their image when they come within half a viewport (.seen). The hero has .seen in its markup. */
var photoIO = null;
function photoInit(root) {
  if (photoIO) photoIO.disconnect();
  var els = root.querySelectorAll(".photo:not(.seen)");
  if (!("IntersectionObserver" in window)) { Array.prototype.forEach.call(els, function (e) { e.classList.add("seen"); }); return; }
  /* A rail loads all six cards at once (small blurred files), so a swipe never shows an empty card. */
  photoIO = new IntersectionObserver(function (es) { es.forEach(function (e) {
    if (!e.isIntersecting) return;
    var g = e.target.closest(".phc-list");
    Array.prototype.forEach.call(g ? g.querySelectorAll(".photo") : [e.target], function (x) { x.classList.add("seen"); photoIO.unobserve(x); });
  }); }, { rootMargin: "50% 100%" });
  Array.prototype.forEach.call(els, function (e) { photoIO.observe(e); });
}
function render(scrollMode) {
  document.body.dataset.page = state.page;
  var needView = last.page !== state.page || last.story !== state.story;
  var v = document.getElementById("view");
  if (needView) {
    var html = state.page === "home" ? home(state.story) : state.page === "planters" ? pagePlanters() : state.page === "oversight" ? pageOversight() :
      state.page === "trust" ? pageTrust() : state.page === "access" ? pageAccess() : pageLegal(PAGE[state.page].name);
    v.innerHTML = html;
    renderNav();
    renderFooter();
  }
  renderBar();
  document.title = (state.page === "home" ? "Home" : PAGE[state.page].name) + " · Story " + STORY[pageStory()].key + " · Everyfield prototype";
  if (scrollMode === "top") window.scrollTo({ top: 0, behavior: "auto" });
  if (scrollMode === "at" && state.at) {
    var target = document.getElementById(state.at);
    if (target && target.classList.contains("faq-i")) faqSet(target, true);
    if (target) setTimeout(function () { target.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
    /* Web fonts re-wrap the text sections above the target; land again once they are in */
    if (target && document.fonts) document.fonts.ready.then(function () { setTimeout(function () { target.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); });
  }
  if (needView) { photoInit(v); setupMotion(); seedBots(); haInit(); cxInit(); phInit(); ovsInit(); visionPlay(v); pthInit(v); }
  last = { page: state.page, story: state.story };
}
function setState(over, push) {
  Object.assign(state, over);
  var href = hrefFor(state.page, state.at);
  if (push) { location.hash = href.slice(1); return; }
  history.replaceState(null, "", href);
  render();
}
function onHash() {
  var prev = Object.assign({}, state);
  state = parseHash();
  var pageChanged = prev.page !== state.page;
  render(state.at ? "at" : pageChanged ? "top" : null);
}
var toastTimer;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
}

/* ---------- Events ---------- */
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-story]");
  if (b && b.closest(".pbar") && !b.disabled) { setState({ story: b.dataset.story }); return; }
  if (e.target.closest(".pb-copy")) {
    var url = location.href;
    var done = function () { toast("Link copied: " + location.hash); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Copy this link", url); });
    else window.prompt("Copy this link", url);
    return;
  }
  if (e.target.closest(".pb-hide")) { document.body.classList.add("pbar-hidden"); return; }
  if (e.target.closest("#pbar-show")) { document.body.classList.remove("pbar-hidden"); return; }
  var tl = e.target.closest("[data-toast]");
  if (tl) { e.preventDefault(); toast(tl.dataset.toast); return; }
  var tg = e.target.closest(".nav-toggle");
  if (tg) { var nav = tg.closest(".site-nav, .nav-pill"); var open = nav.classList.toggle("open"); tg.setAttribute("aria-expanded", open); return; }
  if (e.target.closest(".nav-links a")) navClose();
});
document.addEventListener("change", function (e) {
  if (e.target.matches(".pb-page")) setState({ page: e.target.value, at: "" }, true);
  else if (e.target.matches(".pb-story")) setState({ story: e.target.value });
});
document.addEventListener("submit", function (e) {
  if (e.target.matches("[data-proto-form]")) { e.preventDefault(); e.target.querySelector(".form-msg").classList.add("show"); }
});
window.addEventListener("hashchange", onHash);
if (REDUCED.addEventListener) REDUCED.addEventListener("change", function () { setupMotion(); haInit(); cxInit(); phInit(); ovsInit(); });

state = parseHash();
history.replaceState(null, "", hrefFor(state.page, state.at));
render(state.at ? "at" : null);
})();
</script>
</body>
