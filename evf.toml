# Check slots run these commands; seats do not. Each pattern becomes a `Bash(<pattern>)` deny rule in the seat's
# settings exactly as written, so every form is spelled out: bare, by path, behind env, through npx, pnpm exec,
# pnpm dlx and corepack pnpm, and with pnpm's -r and --filter. `pnpm build` runs `next build`.
# A pattern starts with the command or with `*/`, so a commit message or an `evf ask` that names them stays allowed.
[guards]
heavy = [
  # tsc
  "tsc", "tsc *", "*/tsc", "*/tsc *", "env *tsc", "env *tsc *",
  "npx *tsc", "npx *tsc *", "pnpm *tsc", "pnpm *tsc *", "corepack pnpm *tsc", "corepack pnpm *tsc *",
  # tsgo
  "tsgo", "tsgo *", "*/tsgo", "*/tsgo *", "env *tsgo", "env *tsgo *",
  "npx *tsgo", "npx *tsgo *", "pnpm *tsgo", "pnpm *tsgo *", "corepack pnpm *tsgo", "corepack pnpm *tsgo *",
  # next build
  "next build", "next build *", "*/next build", "*/next build *", "env *next build", "env *next build *",
  "npx *next build", "npx *next build *", "pnpm *next build", "pnpm *next build *",
  "corepack pnpm *next build", "corepack pnpm *next build *",
  # pnpm typecheck, with run, -r or --filter <pkg>
  "pnpm *typecheck*", "*/pnpm *typecheck*", "env *pnpm *typecheck*", "npx *pnpm *typecheck*", "corepack pnpm *typecheck*",
  # test:db, with run, -r or --filter <pkg>
  "pnpm *test:db*", "*/pnpm *test:db*", "env *pnpm *test:db*", "npx *pnpm *test:db*", "corepack pnpm *test:db*",
  # pnpm build, with run, -r or --filter <pkg>
  "pnpm build", "pnpm build *", "pnpm * build", "pnpm * build *",
  "*/pnpm build", "*/pnpm build *", "*/pnpm * build", "*/pnpm * build *",
  "env *pnpm build", "env *pnpm build *", "env *pnpm * build", "env *pnpm * build *",
  "npx *pnpm build", "npx *pnpm build *", "npx *pnpm * build", "npx *pnpm * build *",
  "corepack pnpm build", "corepack pnpm build *", "corepack pnpm * build", "corepack pnpm * build *",
]

# Owner gates. Sebastian, Nov 6 2026, 11:54 AM ET: "Yes, keep my OK on all five, including CI and agent settings".
# A path ending in "/" is a prefix. Anything else is an exact path.

# document-templates: created from Sebastian's Oct 30 2026 words ("I want to approve them one by one"),
