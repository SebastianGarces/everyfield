# evf v2 project rules for Everyfield (GitHub trial, Nov 5 2026).
# Roles, checks and policy are read from the base branch, so a branch cannot weaken them.
# Changing this file is always an owner decision. The base branch, remote and forge are in local.toml.
# Trial path approved by Sebastian (chat t537u / widget Retire pr-body…).
# Roles set by Sebastian's Nov 6 2026 approval: "Yes, switch all evf-v2 roles to Opus 5.5 medium now."

# A check slot starts with no node_modules, so setup installs them. It reruns only when the lockfile changes.
[setup]
name = "install"
run = ["corepack", "pnpm", "install", "--frozen-lockfile"]
inputs = ["pnpm-lock.yaml"]

# fast-check runs first, so a set with a format, lint or type error fails in seconds, before any long check.
# Any check declared after it still runs after it on every set it passes, and the next set after rework runs every
# check again. Nothing is skipped. GitHub's required check `ci` stays the full run on the PR.
# fast-check diffs from merge-base origin/main HEAD, which on a slot is the base head, so it sees the branch's changes.
# It reads the whole tree (no inputs), because its scope is the branch diff.
[[check]]
name = "fast-check"
run = ["bin/dev", "fast-check"]
timeout_minutes = 10

# full-check is `bin/dev check --full`, the verifier's run: lint, typecheck, unit, docs, ci-coverage and the workflow,
# tools-ci, tools-qa and github-scripts suites. None of them needs Postgres. A full run takes 3 to 7 minutes on this
# Mac; the timeout leaves room for a loaded machine. Sebastian, Nov 11 2026: "Yes, file the evf tasks and the
# ci.yml/evf.toml changes; I'll do the GitHub App".
[[check]]
name = "full-check"
run = ["bin/dev", "check", "--full"]
timeout_minutes = 25

# The db packages and the census, as the `db` and `domain (census part N)` jobs in .github/workflows/ci.yml run them.
# They stay inert (commented out) until evf gives each check slot its own throwaway Postgres (the evf-v2 slot-Postgres
# task, ruling D-633). Turned on, they must use that slot's DATABASE_URL, never the shared dev database or Neon.
