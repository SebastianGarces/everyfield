# evf v2 project rules for Everyfield (GitHub trial, Nov 5 2026).
# Roles, checks and policy are read from the base branch, so a branch cannot weaken them.
# Changing this file is always an owner decision. The base branch, remote and forge are in local.toml.
# Trial path approved by Sebastian (chat t537u / widget Retire pr-body…).
# Roles set by Sebastian's Nov 6 2026 approval: "Yes, switch all evf-v2 roles to Opus 5.5 medium now."

# No heavy evf checks for this trial — GitHub required check `ci` still runs on the PR.
# A later owner decision can add format/typecheck checks when ready.

# Owner gates. Sebastian, Nov 6 2026, 11:54 AM ET: "Yes, keep my OK on all five, including CI and agent settings".
# A path ending in "/" is a prefix. Anything else is an exact path.

# document-templates: created from Sebastian's Oct 30 2026 words ("I want to approve them one by one"),
# narrowed by his Nov 8 2026 words (quote below) to the template content files only, not document code.
# A new template JSON or *-content.ts file must be added here by exact path: evf cannot match globs such as *.json.
[[policy.class]]
name = "document-templates"
paths = [
  "packages/domain/src/documents/templates/agenda-content.ts",
  "packages/domain/src/documents/templates/budget-worksheet.json",
  "packages/domain/src/documents/templates/bylaws.json",
  "packages/domain/src/documents/templates/card-content.ts",
  "packages/domain/src/documents/templates/checklists-content.ts",
  "packages/domain/src/documents/templates/church-content.ts",
  "packages/domain/src/documents/templates/commitment-card.json",
  "packages/domain/src/documents/templates/conflict-of-interest-policy.json",
  "packages/domain/src/documents/templates/follow-up-letter.json",
  "packages/domain/src/documents/templates/guest-sign-in-sheet.json",
  "packages/domain/src/documents/templates/launch-team-commitment.json",
  "packages/domain/src/documents/templates/member-expectations.json",
  "packages/domain/src/documents/templates/prayer-letter.json",
  "packages/domain/src/documents/templates/text-content.ts",
]
outcome = "owner"
quote = "when I meant document-template code I meant the actual templates... if you are talking about functionality, I don't necessarily have to approve it. I was referring to actual templates themselves"
quoted_at = "2026-11-09T04:16:00Z"

[[policy.class]]
